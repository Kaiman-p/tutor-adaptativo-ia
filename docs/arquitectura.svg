  <text x="340" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Envia codigo del ejercicio</text>
  <line x1="340" y1="96" x2="340" y2="156" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="156" width="320" height="56" rx="8" fill="#f2f2f2" stroke="#999999" stroke-width="1"/>
  <text x="340" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222">Sandbox</text>
  <text x="340" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Verifica correccion funcional (Python/C/Java/SQL)</text>
  <line x1="340" y1="212" x2="340" y2="272" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

