  <text x="340" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4b2a8a">LLM (nucleo de IA)</text>
  <text x="340" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5c3d99">Groq / Anthropic / Gemini -- clasifica dominio conceptual</text>
  <line x1="340" y1="328" x2="340" y2="388" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

