  <rect x="180" y="504" width="320" height="56" rx="8" fill="#dcf3ea" stroke="#2f9e6e" stroke-width="1"/>
  <text x="340" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d6b48">Recomendador</text>
  <text x="340" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c7a53">Decide: avanzar / repetir / remedial / refuerzo</text>

  <text x="340" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444444">vuelve a Estudiante con el siguiente nivel o ejercicio remedial generado por IA</text>

