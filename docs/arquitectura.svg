  <text x="340" y="623" font-family="Arial, sans-serif" font-size="11" fill="#444444">Nucleo de IA</text>
  <rect x="450" y="612" width="14" height="14" fill="#dcf3ea" stroke="#2f9e6e"/>
  <text x="470" y="623" font-family="Arial, sans-serif" font-size="11" fill="#444444">Decision</text>
